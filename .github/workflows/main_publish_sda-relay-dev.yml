name: Relay build and test (no deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports: ['10000:10000', '10001:10001']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test source and deployment guards
        shell: pwsh
        run: |
          ./Tests/Deployment/Prepare-RelayDeployment.Tests.ps1
          ./Tests/Deployment/Workflow-Contracts.Tests.ps1
          ./Tests/Deployment/Release-Workflow.Tests.ps1 -EvidenceDirectory 'Documentation/Projects/Working/logs/ci-release-fixtures'
          ./Tests/Deployment/Package-Promotion.Tests.ps1 -EvidenceDirectory 'Documentation/Projects/Working/logs/ci-package-fixtures'
          dotnet test Tests/SovereignTrust.Relay.Tests/SovereignTrust.Relay.Tests.csproj --configuration Release --logger trx --results-directory Documentation/Projects/Working/logs/ci-tests
          if ($LASTEXITCODE) { throw 'Tests failed' }
          if ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch') {
            ./scripts/New-RelayPackage.ps1 -OutputDirectory '${{ runner.temp }}/relay-package'
            ./scripts/Test-RelayPackage.ps1 -PackageDirectory '${{ runner.temp }}/relay-package' -ReleaseSha '${{ github.sha }}'
          } else {
            ./scripts/New-RelayPackage.ps1 -OutputDirectory '${{ runner.temp }}/relay-package' -BuildOnly
            ./scripts/Test-RelayPackage.ps1 -PackageDirectory '${{ runner.temp }}/relay-package' -ReleaseSha '${{ github.sha }}' -BuildOnly
          }
      - uses: actions/upload-artifact@v4
        id: linux_build_artifact
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'relay-manual-package' || 'relay-ci-linux-package' }}
          path: |
            ${{ runner.temp }}/relay-package/relay.zip
            ${{ runner.temp }}/relay-package/release.json
            ${{ runner.temp }}/relay-package/host-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Record nondeployment Linux artifact identity
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.linux_build_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.linux_build_artifact.outputs.artifact-digest }}
        run: |
          "NO DEPLOYMENT; event=$env:GITHUB_EVENT_NAME; run=$env:GITHUB_RUN_ID; commit=$env:GITHUB_SHA; artifact=$env:ARTIFACT_ID; digest=$env:ARTIFACT_DIGEST" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-ci-evidence
          path: |
            Documentation/Projects/Working/logs/ci-tests/
            ${{ runner.temp }}/relay-package/host-evidence/
          retention-days: 30
