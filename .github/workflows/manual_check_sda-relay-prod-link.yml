name: Check ordinary Relay prod Azure link
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sda-prod
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_REF: ${{ vars.RELAY_RELEASE_REF }}
      APP_ID: ${{ vars.RELAY_APP_RESOURCE_ID }}
    steps:
      - name: Require exact owner ref and new app contract
        shell: pwsh
        run: |
          if (!$env:RELEASE_REF -or $env:GITHUB_REF -cne $env:RELEASE_REF -or
              $env:APP_ID -ine '/subscriptions/b7690041-454b-472b-b340-3d8dde115103/resourceGroups/sda-prod/providers/Microsoft.Web/sites/sda-relay-api-prod') { throw 'Missing/mismatched owner contract' }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.RELAY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.RELAY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.RELAY_AZURE_SUBSCRIPTION_ID }}
      - name: Read exact ordinary target only
        shell: pwsh
        run: |
          $json=az resource show --ids $env:APP_ID --subscription 'b7690041-454b-472b-b340-3d8dde115103' --output json --only-show-errors
          if ($LASTEXITCODE) { throw 'Azure read failed' }
          $app=($json -join "`n")|ConvertFrom-Json
          if ($app.id -ine $env:APP_ID -or $app.kind -notmatch 'linux' -or $app.kind -match 'functionapp' -or $app.properties.state -ne 'Running') { throw 'Wrong target/state' }