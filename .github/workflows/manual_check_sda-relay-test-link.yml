name: Check Relay test Azure link
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sda-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: 6a3a0c9c-17df-486c-84b7-adc73204fa65
          tenant-id: 8904b745-1738-426c-ad85-3fcecb32d24b
          subscription-id: 5c813ecc-3c19-44de-b676-304116fc869d
      - name: Verify exact test app without changing it
        shell: bash
        run: |
          set -euo pipefail
          expected='/subscriptions/5c813ecc-3c19-44de-b676-304116fc869d/resourceGroups/sda-test/providers/Microsoft.Web/sites/sda-relay-test'
          actual=$(az resource show --ids "$expected" --query id -o tsv)
          test "${actual,,}" = "${expected,,}"
          state=$(az resource show --ids "$expected" --query properties.state -o tsv)
          test "$state" = 'Running'
