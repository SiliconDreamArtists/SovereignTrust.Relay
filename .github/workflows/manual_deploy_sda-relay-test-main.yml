name: Deploy ordinary Relay Test manually
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit SHA at the selected allowed release ref
        required: true
        type: string
      previous_run_id:
        description: Successful previous environment manual deployment run ID (same release)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: relay-webapp-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sda-test
    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
      RELAY_RELEASE_REF: ${{ vars.RELAY_RELEASE_REF }}
      APP_RESOURCE_ID: ${{ vars.RELAY_APP_RESOURCE_ID }}
      PLAN_RESOURCE_ID: ${{ vars.RELAY_PLAN_RESOURCE_ID }}
      AZURE_CLIENT_ID: ${{ vars.RELAY_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.RELAY_AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.RELAY_AZURE_SUBSCRIPTION_ID }}
      RELAY_PREVIOUS_ACCEPTED_RUN_ID: ${{ vars.RELAY_PREVIOUS_ACCEPTED_RUN_ID }}
      RELAY_PREVIOUS_ACCEPTED_PACKAGE_SHA256: ${{ vars.RELAY_PREVIOUS_ACCEPTED_PACKAGE_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact dispatch/ref and complete owner contract
        shell: pwsh
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'SiliconDreamArtists/SovereignTrust.Relay' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or !$env:RELAY_RELEASE_REF -or
              $env:GITHUB_REF -cne $env:RELAY_RELEASE_REF -or $env:RELAY_RELEASE_REF -notmatch '^refs/heads/' -or
              $env:RELEASE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:RELEASE_SHA) { throw 'Unreviewed source/ref' }
          foreach ($name in @('APP_RESOURCE_ID','PLAN_RESOURCE_ID','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID')) {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing owner contract $name" }
          }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify previous environment run
        shell: pwsh
        run: ./scripts/Test-RelayPromotion.ps1 -Environment Test -PreviousRunId $env:PREVIOUS_RUN_ID -ReleaseSha $env:RELEASE_SHA
      - uses: actions/download-artifact@v4
        with:
          name: relay-release
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/relay-package
      - name: Verify exact immutable package before login/deploy
        shell: pwsh
        run: ./scripts/Test-RelayPackage.ps1 -PackageDirectory '${{ runner.temp }}/relay-package' -ReleaseSha $env:RELEASE_SHA -AcceptedPackageSha256 $env:RELAY_PREVIOUS_ACCEPTED_PACKAGE_SHA256
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Check ordinary target without changing settings/storage
        shell: pwsh
        run: ./scripts/Prepare-RelayDeployment.ps1 -Environment Test -AppResourceId $env:APP_RESOURCE_ID -PlanResourceId $env:PLAN_RESOURCE_ID
      - uses: azure/webapps-deploy@v3
        with:
          app-name: sda-relay-api-test
          package: ${{ runner.temp }}/relay-package/relay.zip
      - name: Record deployed package identity
        shell: pwsh
        run: |
          $manifest=Get-Content -Raw '${{ runner.temp }}/relay-package/release.json' | ConvertFrom-Json
          "Test accepted deployment action completed; source=$($manifest.sourceSha); package=$($manifest.packageSha256)" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        id: release_artifact
        with:
          name: relay-release
          path: |
            ${{ runner.temp }}/relay-package/relay.zip
            ${{ runner.temp }}/relay-package/release.json
          retention-days: 30
          if-no-files-found: error
      - name: Record immutable artifact ID
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.release_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.release_artifact.outputs.artifact-digest }}
        run: |
          "Run=$env:GITHUB_RUN_ID; artifact=$env:ARTIFACT_ID; artifact digest=$env:ARTIFACT_DIGEST" >> $env:GITHUB_STEP_SUMMARY
